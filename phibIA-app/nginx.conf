events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compresión de texto (JS/CSS/HTML/JSON) para reducir el peso transferido
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Headers de seguridad básicos, aplican a frontend y backend
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend: All web pages
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend: Everything starting with /api
        location /api/ {
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            # Permitir bodies grandes para uploads (audio). Ajusta según necesidad.
            client_max_body_size 50M;

            # Aumentar timeout para procesamiento de audio ML
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}