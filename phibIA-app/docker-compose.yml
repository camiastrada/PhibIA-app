
services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: anfibios
      POSTGRES_USER: phibia_user
      POSTGRES_PASSWORD: user123
    volumes:
      - ./db/anfibios.sql:/docker-entrypoint-initdb.d/1_init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phibia_user -d anfibios"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: frontend_app
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend 

  backend:
    build: ./backend
    container_name: flask_app
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./db:/db:ro
    environment:
      - FLASK_ENV=development
      - POSTGRES_HOST=db
      - POSTGRES_USER=phibia_user
      - POSTGRES_PASSWORD=user123
      - POSTGRES_DATABASE=anfibios
      - POSTGRES_PORT=5432
      - JWT_SECRET_KEY=cd0562e2a7cce7ce24d960874ac7bb01349507dffa165f1c9f58a5676cbe9cf1
      - CLOUDINARY_CLOUD_NAME=dksq6fnev
      - CLOUDINARY_API_KEY=155444477795147
      - CLOUDINARY_API_SECRET=6hjNEaLoDQSR7uBUBlu-nwkrfek
    command: python run.py
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
        
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped