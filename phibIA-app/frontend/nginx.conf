server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Assets generados por Vite con hash en el nombre (index-BomO8AHu.js, etc.):
    # el hash cambia si el contenido cambia, así que cachear "para siempre" es seguro.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Archivos estáticos servidos desde public/ (favicon, logos, etc.) SIN hash en el nombre:
    # si se reemplaza el archivo, el navegador tiene que poder notarlo, así que cache corto.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600";
    }
}